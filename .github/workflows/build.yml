# Build every board on every push and pull request, and keep the images.
#
# A change made while testing one board can break another that nobody
# flashed that day; this is the check that all four still compile. Each
# run's firmware is downloadable from its page under Actions:
# firmware.bin for a network update, firmware-merged.bin for a blank board.
#
# Pushing a v* tag also drafts a GitHub release with every board's images
# attached, named for the board. The draft takes its notes from the tag's
# message; check it and publish it by hand. Publishing it puts its merged
# images on the install page (pages.yml).

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      # One board failing says nothing about the others; see all four.
      fail-fast: false
      matrix:
        env: [headless, waveshare-s3, round360-s3, qualia-720]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The platform, toolchain and Arduino core are a gigabyte and more.
      # One cache for all four jobs: they share every package but the
      # board definitions, and four copies would crowd the repository's
      # cache allowance. A new platformio.ini (a platform bump, a library
      # change) starts a fresh one.
      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build
        run: pio run -e ${{ matrix.env }}

      - name: Merge a flash image for a blank board
        if: matrix.env != 'headless'
        run: pio run -e ${{ matrix.env }} -t merge

      - uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware-merged.bin
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For the tag's message, which a shallow checkout leaves behind.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Only the boards with a panel: headless is for development.
      - uses: actions/download-artifact@v7
        with:
          pattern: firmware-*-*
          path: artifacts

      # Every board's images are firmware.bin and firmware-merged.bin; on a
      # release they sit side by side, so each takes its board's name.
      - name: Name the images for their boards
        run: |
          mkdir release
          for dir in artifacts/firmware-*; do
            env="${dir#artifacts/firmware-}"
            cp "$dir/firmware.bin" "release/firmware-$env.bin"
            cp "$dir/firmware-merged.bin" "release/firmware-$env-merged.bin"
          done
          ls -l release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --draft --verify-tag --notes-from-tag
          --title "$GITHUB_REF_NAME"
