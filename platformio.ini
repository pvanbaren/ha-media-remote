; Home Assistant media remote.
;
; The default target is a Waveshare ESP32-S3-Touch-LCD-1.28: a 1.28" round
; GC9A01 (240x240) with a CST816S touch panel, a switchable backlight, 16 MB
; flash, 2 MB PSRAM and a CH343 UART bridge, all integrated.
;
; The panel is chosen here and nowhere else. src/app/ and src/services/ build
; against ui/ui.h and know nothing about a display; each panel supplies its
; own src/ui/<shape>/ and its own include/board/<board>.h, and an env picks
; one with build_src_filter. Adding a panel is a directory and a stanza below
; -- no #if, and nothing above the seam to edit.

[platformio]
default_envs = waveshare-s3
; Optional, untracked machine-local overrides (upload_port / monitor_port).
; Globbed, so the build still works on machines without one.
extra_configs = platformio-local*.ini

[env]
; pioarduino's fork (arduino-esp32 3.x / IDF 5.x). The stock platform predates
; the S3 board definitions this project targets.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

build_flags =
  -std=gnu++23
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.29
  tzapu/WiFiManager@^2.0.17

; --- Targets ----------------------------------------------------------------

[env:waveshare-s3]
board = waveshare_esp32s3_touch_lcd_128
board_build.partitions = partitions/media_remote.csv
extra_scripts =
  pre:scripts/board_header_stamp.py
  post:scripts/merge_firmware.py
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/waveshare_s3.h"'

; The board definition sets memory_type qio_qspi and -DBOARD_HAS_PSRAM itself.
; Serial goes out UART0 through the onboard CH343 bridge rather than native
; USB, so ARDUINO_USB_CDC_ON_BOOT stays off.

; Anti-aliased VLW faces, one per on-screen pixel height the UI uses. Keep this
; list, the --heights argument to scripts/build_ui_font.py and s_fonts[] in
; display_font.cpp in step with one another.
board_build.embed_files =
  data/ui_font_15.vlw
  data/ui_font_17.vlw
  data/ui_font_20.vlw
  data/ui_font_24.vlw

; The round panel plus the shared screens; every other panel is left out.
build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/square/>
  -<hardware/round360/>
  -<hardware/headless/>

[env:round360-s3]
; A DFRobot DFR1221 "ESP32-S3R8 1.85-inch Round Display Board": 360x360 round
; ST77916 on quad SPI, CST816S touch, 16 MB flash, 8 MB PSRAM. Named for the
; panel rather than the vendor because it is easily mistaken for a Waveshare
; 1.85, which is wired differently -- see include/board/round360_s3.h.
board = esp32-s3-devkitc-1
board_build.partitions = partitions/media_remote.csv
; esp32-s3-devkitc-1 says 8 MB of flash; the DFR1221 has 16, which the
; partition table uses -- the second app slot ends past the 8 MB mark.
board_upload.flash_size = 16MB
; 8 MB of octal PSRAM, which the 259 KB composed frame and the cover art cache
; both live in.
board_build.arduino.memory_type = qio_opi
extra_scripts =
  pre:scripts/board_header_stamp.py
  post:scripts/merge_firmware.py
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/round360_s3.h"'
  -DBOARD_HAS_PSRAM
; No -DLGFX_USE_QSPI here: LovyanGFX defines it itself for an ESP32-S3 on IDF
; 4.4 or newer, and setting it again only produces a redefinition warning.

; Fonts at the sizes a 360 px panel asks for: theme::px() scales by kUiScale,
; which is 1.5 here, so 15/17/20/24 becomes 23/26/30/36.
board_build.embed_files =
  data/ui_font_23.vlw
  data/ui_font_26.vlw
  data/ui_font_30.vlw
  data/ui_font_36.vlw

build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/square/>
  -<hardware/waveshare/>
  -<hardware/headless/>

[env:headless]
; An ESP32-S3 with nothing on the SPI bus. Everything above ui/ui.h builds and
; runs, and narrates to the serial console instead of drawing. Useful while a
; panel is being brought up, and a standing check that nothing has leaked back
; across the seam: if this stops linking, something in src/app/ or
; src/services/ has grown a pixel.
board = esp32-s3-devkitc-1
; The board definition says 8 MB; every board this project builds for has 16,
; and the partition table below is laid out for them.
board_upload.flash_size = 16MB
board_build.partitions = partitions/media_remote.csv
build_src_filter =
  +<*>
  -<ui/common/>
  -<ui/round/>
  -<ui/square/>
  -<hardware/headless/>
  -<hardware/waveshare/>
  -<hardware/round360/>
  -<hardware/display_font.cpp>
  -<hardware/touch_gestures.cpp>
