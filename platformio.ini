; Home Assistant media remote.
;
; The default target is a Waveshare ESP32-S3-Touch-LCD-1.28: a 1.28" round
; GC9A01 (240x240) with a CST816S touch panel, a switchable backlight, 16 MB
; flash, 2 MB PSRAM and a CH343 UART bridge, all integrated.
;
; The panel is chosen here and nowhere else. src/app/ and src/services/ build
; against ui/ui.h and know nothing about a display; each panel supplies its
; own src/ui/<shape>/ and its own include/board/<board>.h, and an env picks
; one with build_src_filter. Adding a panel is a directory and a stanza below
; -- no #if, and nothing above the seam to edit.

[platformio]
default_envs = waveshare-s3
; Optional, untracked machine-local overrides (upload_port / monitor_port).
; Globbed, so the build still works on machines without one.
extra_configs = platformio-local*.ini

[env]
; pioarduino's fork (arduino-esp32 3.x / IDF 5.x). The stock platform predates
; the S3 board definitions this project targets.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

build_flags =
  -std=gnu++23
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.29
  tzapu/WiFiManager@^2.0.17

; --- Targets ----------------------------------------------------------------

[env:waveshare-s3]
board = waveshare_esp32s3_touch_lcd_128
board_build.partitions = partitions/media_remote.csv
extra_scripts =
  pre:scripts/board_header_stamp.py
  pre:scripts/firmware_version.py
  post:scripts/merge_firmware.py
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/waveshare_s3.h"'

; The board definition sets memory_type qio_qspi and -DBOARD_HAS_PSRAM itself.
; Serial goes out UART0 through the onboard CH343 bridge rather than native
; USB, so ARDUINO_USB_CDC_ON_BOOT stays off.

; Anti-aliased VLW faces, one per on-screen pixel height the UI uses. Keep this
; list, the --heights argument to scripts/build_ui_font.py and s_fonts[] in
; display_font.cpp in step with one another.
board_build.embed_files =
  data/ui_font_15.vlw
  data/ui_font_17.vlw
  data/ui_font_20.vlw
  data/ui_font_24.vlw

; The round panel plus the shared screens; every other panel is left out.
build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/square/>
  -<hardware/qualia/>
  -<hardware/round360/>
  -<hardware/lcd28c/>
  -<hardware/rgb/>
  -<hardware/headless/>
  -<hardware/matouch21/>
  -<hardware/guition4848/>
  -<hardware/amoled466/>
  -<hardware/lcd4b/>

[env:qualia-720]
; Adafruit Qualia ESP32-S3 for RGB-666 (5800) carrying the 4" square 720x720
; capacitive panel (5794, TL040HDS20). 16 MB flash, 8 MB octal PSRAM -- a
; megabyte for the one scan-out buffer and another for the composed frame it
; is copied from. One scan-out buffer rather than two so that it always holds
; the frame on the glass, which is what lets a scrolling list move its rows in
; place; see include/hardware/rgb_panel.h.
;
; BUILD THIS FROM POWERSHELL, NOT GIT-BASH. pioarduino's idf_tools.py aborts
; with "MSys/Mingw is not supported" whenever MSYSTEM is set.
board = adafruit_qualia_s3_rgb666
board_build.partitions = partitions/media_remote.csv
; Octal PSRAM. Without this the framebuffer cannot be allocated and the panel
; never comes up.
board_build.arduino.memory_type = qio_opi
; Nothing flashed beside the firmware. Adafruit's board definition adds
; TinyUF2, its drag-and-drop bootloader, at 0x410000: a 256 KB slot in
; Adafruit's partition table, but the start of the second 4 MB app slot in
; this one. So every USB upload put TinyUF2 in that slot, and the Qualia's UF2
; drive with it, and a .uf2 copied onto that drive was written over the app
; with no regard for this table's slot sizes -- which is how a 5 MB image of
; other firmware once came to fill both slots and stop the board booting.
board_upload.arduino.flash_extra_images =
extra_scripts =
  pre:scripts/board_header_stamp.py
  pre:scripts/firmware_version.py
  post:scripts/merge_firmware.py
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/qualia_720.h"'

; Arduino's prebuilt libraries, like the other boards. They already restart
; the scan-out DMA on every VSYNC (CONFIG_LCD_RGB_RESTART_IN_VSYNC), which is
; what pulls the picture back into line after a FIFO underrun. What they do
; not do is keep that handler in IRAM, so while the flash cache is off -- an
; NVS write, a portal save -- the restart waits and can land mid-frame, for
; one frame. The fix is CONFIG_LCD_RGB_ISR_IRAM_SAFE=y, which means building
; the IDF from source (custom_sdkconfig) and, since that IDF has no TinyUSB,
; ARDUINO_USB_MODE=1 for a console. Left out: one frame at a save is not worth
; an IDF build and a toolchain unlike every other board's.

; Fonts at the sizes a 720 px panel asks for: theme::textPx() scales by
; kUiScale, 3.0 here, and by kTextScale, 0.75, so 15/17/20/24 becomes
; 34/38/45/54. The lists are smaller again (kListScale, 2/3), which lands
; their text on 23/26/30 -- the round360 faces, shared rather than regenerated.
board_build.embed_files =
  data/ui_font_34.vlw
  data/ui_font_38.vlw
  data/ui_font_45.vlw
  data/ui_font_54.vlw
  data/ui_font_23.vlw
  data/ui_font_26.vlw
  data/ui_font_30.vlw

build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/round/>
  -<hardware/waveshare/>
  -<hardware/round360/>
  -<hardware/lcd28c/>
  -<hardware/headless/>
  -<hardware/matouch21/>
  -<hardware/guition4848/>
  -<hardware/amoled466/>
  -<hardware/lcd4b/>

[env:round360-s3]
; A DFRobot DFR1221 "ESP32-S3R8 1.85-inch Round Display Board": 360x360 round
; ST77916 on quad SPI, CST816S touch, 16 MB flash, 8 MB PSRAM. Named for the
; panel rather than the vendor because it is easily mistaken for a Waveshare
; 1.85, which is wired differently -- see include/board/round360_s3.h.
board = esp32-s3-devkitc-1
board_build.partitions = partitions/media_remote.csv
; esp32-s3-devkitc-1 says 8 MB of flash; the DFR1221 has 16, which the
; partition table uses -- the second app slot ends past the 8 MB mark.
board_upload.flash_size = 16MB
; 8 MB of octal PSRAM, which the 259 KB composed frame and the cover art cache
; both live in.
board_build.arduino.memory_type = qio_opi
extra_scripts =
  pre:scripts/board_header_stamp.py
  pre:scripts/firmware_version.py
  post:scripts/merge_firmware.py
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/round360_s3.h"'
  -DBOARD_HAS_PSRAM
  ; As on the 2.8C: the USB-C port is the S3's own USB, its serial/JTAG unit,
  ; so the console goes there rather than out of UART0, which it lacks a port
  ; for.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
; No -DLGFX_USE_QSPI here: LovyanGFX defines it itself for an ESP32-S3 on IDF
; 4.4 or newer, and setting it again only produces a redefinition warning.

; Fonts at the sizes a 360 px panel asks for: theme::px() scales by kUiScale,
; which is 1.5 here, so 15/17/20/24 becomes 23/26/30/36.
board_build.embed_files =
  data/ui_font_23.vlw
  data/ui_font_26.vlw
  data/ui_font_30.vlw
  data/ui_font_36.vlw

build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/square/>
  -<hardware/qualia/>
  -<hardware/waveshare/>
  -<hardware/lcd28c/>
  -<hardware/rgb/>
  -<hardware/headless/>
  -<hardware/matouch21/>
  -<hardware/guition4848/>
  -<hardware/amoled466/>
  -<hardware/lcd4b/>

[env:lcd28c-s3]
; Waveshare ESP32-S3-Touch-LCD-2.8C: 2.8" round 480x480 ST7701 on the RGB
; parallel bus, GT911 touch, 16 MB flash, 8 MB octal PSRAM. The Qualia's kind
; of panel in the round screens' shape -- see include/board/lcd28c_s3.h.
board = esp32-s3-devkitc-1
board_build.partitions = partitions/media_remote.csv
; The board definition says 8 MB of flash; this one has 16.
board_upload.flash_size = 16MB
; Octal PSRAM, for the framebuffer the panel is scanned out of and the
; composed frame copied into it.
board_build.arduino.memory_type = qio_opi
extra_scripts =
  pre:scripts/board_header_stamp.py
  pre:scripts/firmware_version.py
  post:scripts/merge_firmware.py
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/lcd28c_s3.h"'
  -DBOARD_HAS_PSRAM
  ; The USB-C port is the S3's own USB, its serial/JTAG unit, so the console
  ; goes there rather than out of UART0.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; The round 360 px board's faces: kUiScale 2.0 and kTextScale 0.75 land
; theme::textPx() on 23/26/30/36. Keep in step with font_table.cpp.
board_build.embed_files =
  data/ui_font_23.vlw
  data/ui_font_26.vlw
  data/ui_font_30.vlw
  data/ui_font_36.vlw

build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/square/>
  -<hardware/qualia/>
  -<hardware/waveshare/>
  -<hardware/round360/>
  -<hardware/headless/>
  -<hardware/matouch21/>
  -<hardware/guition4848/>
  -<hardware/amoled466/>
  -<hardware/lcd4b/>

[env:headless]
; An ESP32-S3 with nothing on the SPI bus. Everything above ui/ui.h builds and
; runs, and narrates to the serial console instead of drawing. Useful while a
; panel is being brought up, and a standing check that nothing has leaked back
; across the seam: if this stops linking, something in src/app/ or
; src/services/ has grown a pixel.
board = esp32-s3-devkitc-1
; The board definition says 8 MB; every board this project builds for has 16,
; and the partition table below is laid out for them.
board_upload.flash_size = 16MB
board_build.partitions = partitions/media_remote.csv
extra_scripts =
  pre:scripts/firmware_version.py
build_src_filter =
  +<*>
  -<ui/common/>
  -<ui/round/>
  -<ui/square/>
  -<hardware/qualia/>
  -<hardware/waveshare/>
  -<hardware/round360/>
  -<hardware/lcd28c/>
  -<hardware/rgb/>
  -<hardware/matouch21/>
  -<hardware/guition4848/>
  -<hardware/amoled466/>
  -<hardware/lcd4b/>
  -<hardware/display_font.cpp>
  -<hardware/outline_fonts.cpp>
  -<hardware/touch_gestures.cpp>
  -<hardware/encoder.cpp>
  -<hardware/battery.cpp>

[env:matouch21-s3]
; Makerfabs MaTouch ESP32-S3 Rotary IPS Display with Touch 2.1": round
; 480x480 ST7701 on the RGB parallel bus, CST826 touch, a rotary encoder and
; push switch, 16 MB flash, 8 MB octal PSRAM. The 2.8C's kind of panel without
; its expander -- see include/board/matouch21_s3.h.
board = esp32-s3-devkitc-1
board_build.partitions = partitions/media_remote.csv
; The board definition says 8 MB of flash; this one has 16.
board_upload.flash_size = 16MB
; Octal PSRAM, for the framebuffer the panel is scanned out of and the
; composed frame copied into it.
board_build.arduino.memory_type = qio_opi
extra_scripts =
  pre:scripts/board_header_stamp.py
  pre:scripts/firmware_version.py
  post:scripts/merge_firmware.py
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/matouch21_s3.h"'
  -DBOARD_HAS_PSRAM
  ; The USB-C port is the S3's own USB, its serial/JTAG unit, so the console
  ; goes there.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; The 2.8C's faces: kUiScale 2.0 and kTextScale 0.75 land theme::textPx() on
; 23/26/30/36. Keep in step with font_table.cpp.
board_build.embed_files =
  data/ui_font_23.vlw
  data/ui_font_26.vlw
  data/ui_font_30.vlw
  data/ui_font_36.vlw

build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/square/>
  -<hardware/qualia/>
  -<hardware/waveshare/>
  -<hardware/round360/>
  -<hardware/lcd28c/>
  -<hardware/headless/>
  -<hardware/guition4848/>
  -<hardware/amoled466/>
  -<hardware/lcd4b/>

[env:guition4848-s3]
; Guition (Sunton) ESP32-4848S040, sold also as AITRIP's "ESP32-S3 4.0 inch
; 480 x 480": square 480x480 ST7701 on the RGB parallel bus, GT911 touch,
; 16 MB flash, 8 MB octal PSRAM. The MaTouch's kind of panel on the Qualia's
; size of glass -- see include/board/guition4848_s3.h.
board = esp32-s3-devkitc-1
board_build.partitions = partitions/media_remote.csv
; The board definition says 8 MB of flash; this one has 16.
board_upload.flash_size = 16MB
; Octal PSRAM, for the framebuffer the panel is scanned out of and the
; composed frame copied into it.
board_build.arduino.memory_type = qio_opi
extra_scripts =
  pre:scripts/board_header_stamp.py
  pre:scripts/firmware_version.py
  post:scripts/merge_firmware.py
; USB is a CH340 to UART0, which is where the console goes by default.
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/guition4848_s3.h"'
  -DBOARD_HAS_PSRAM
; ESP-IDF built from source for this board alone, with two settings the
; prebuilt libraries leave off: code and read-only data run from PSRAM, so a
; flash write -- a setting saved, a pick written to the history -- leaves the
; cache on, and the RGB LCD's interrupt kept in IRAM, so the bounce buffer's
; refills and the frame-by-frame restarts carry on through one. Without them
; this panel slipped a few rows out of step during flash writes and stayed
; there until the power was cut; see include/board/guition4848_s3.h.
;
; The first build compiles the IDF, about five minutes. It also replaces the
; Arduino libraries in the PlatformIO home it runs in, which every other env
; then re-downloads, and this one rebuilds, on each switch: give this env a
; home of its own (PLATFORMIO_CORE_DIR) when building it beside the others.
; Needs SCons 4.11.1 where the platform asks for 4.8.1, which fails the link
; with "No module named SCons.Tool.FortranCommon" (pioarduino/platform-
; espressif32 #529): docs/building.md says how, and CI does it.
custom_sdkconfig =
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y

; kUiScale 2.0 and kTextScale 0.75 land theme::textPx() on 23/26/30/36, the
; 2.8C's faces; the lists, at kListScale 2/3, on 15/17/20, the 1.28"'s. Keep
; in step with font_table.cpp.
board_build.embed_files =
  data/ui_font_15.vlw
  data/ui_font_17.vlw
  data/ui_font_20.vlw
  data/ui_font_23.vlw
  data/ui_font_26.vlw
  data/ui_font_30.vlw
  data/ui_font_36.vlw

build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/round/>
  -<hardware/qualia/>
  -<hardware/waveshare/>
  -<hardware/round360/>
  -<hardware/lcd28c/>
  -<hardware/headless/>
  -<hardware/matouch21/>
  -<hardware/amoled466/>
  -<hardware/lcd4b/>

[env:amoled466-s3]
; A Waveshare ESP32-S3-Touch-AMOLED-1.75: 466x466 round CO5300 AMOLED on
; quad SPI, CST9217 touch, 16 MB flash, 8 MB octal PSRAM, and an AXP2101 power
; manager this firmware leaves at its defaults. Named for the panel, as
; round360 is -- see include/board/amoled466_s3.h.
board = esp32-s3-devkitc-1
board_build.partitions = partitions/media_remote.csv
; esp32-s3-devkitc-1 says 8 MB; this board has 16, as Waveshare's own builds
; set, and the second app slot ends past the 8 MB mark.
board_upload.flash_size = 16MB
; Octal PSRAM, for the 434 KB composed frame and the cover art cache.
board_build.arduino.memory_type = qio_opi
extra_scripts =
  pre:scripts/board_header_stamp.py
  pre:scripts/firmware_version.py
  post:scripts/merge_firmware.py
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/amoled466_s3.h"'
  ; Voice: the wake word, Assist and spoken replies (services/voice.h).
  -DVOICE_ASSIST
  -DBOARD_HAS_PSRAM
  ; The S3's own USB port is the board's only one, so the console is on it.
  -DARDUINO_USB_CDC_ON_BOOT=1

; Fonts at the sizes a 466 px panel asks for: theme::textPx() scales by
; kUiScale, 466/240 here, and kTextScale 1.0, so 15/17/20/24 becomes
; 29/33/39/47. Keep in step with font_table.cpp.
; And the wake words' models, microWakeWord's "Hey Jarvis", "Okay Nabu",
; "Hey Mycroft" and "Alexa" (v2, from esphome/micro-wake-word-models at
; 40ff33f5, Apache License 2.0): 51 to 59 KB each, 220 KB in all, for
; services/wake_word.cpp, on this board for its microphone.
board_build.embed_files =
  data/ui_font_29.vlw
  data/ui_font_33.vlw
  data/ui_font_39.vlw
  data/ui_font_47.vlw
  data/hey_jarvis.tflite
  data/okay_nabu.tflite
  data/hey_mycroft.tflite
  data/alexa.tflite

build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/square/>
  -<hardware/qualia/>
  -<hardware/waveshare/>
  -<hardware/round360/>
  -<hardware/lcd28c/>
  -<hardware/rgb/>
  -<hardware/headless/>
  -<hardware/matouch21/>
  -<hardware/guition4848/>
  -<hardware/lcd4b/>

[env:amoled466c-s3]
; A Waveshare ESP32-S3-Touch-AMOLED-1.75C: the 1.75's panel, touch and pins
; but for its two resets, in a metal case, with 32 MB of flash, of which this
; uses the first 16 -- see include/board/amoled466_s3.h. Untried on a board.
extends = env:amoled466-s3
build_flags =
  ${env:amoled466-s3.build_flags}
  -DBOARD_AMOLED466_175C

[env:lcd4b-p4]
; Waveshare ESP32-P4-WIFI6-Touch-LCD-4B: 4" square 720x720 ST7703 on two-lane
; MIPI-DSI, GT911 touch, 32 MB flash, 32 MB PSRAM, and an ESP32-C6 for Wi-Fi
; over SDIO (ESP-Hosted, inside Arduino's WiFi library). The Qualia's glass on
; an ESP32-P4 -- see include/board/lcd4b_p4.h.
;
; esp32-p4 is the board definition for P4s before revision 3, which this
; board's (v1.3) is: the Arduino libraries for those are esp32p4_es. A
; revision 3 board wants esp32-p4_r3, and an image built for the one does not
; boot on the other.
board = esp32-p4
board_build.partitions = partitions/media_remote.csv
; The board definition says 4 MB; this one has 32. The partition table uses
; the first 16, as on every other board.
board_upload.flash_size = 32MB
board_upload.maximum_size = 4194304
extra_scripts =
  pre:scripts/board_header_stamp.py
  pre:scripts/deflate_embeds.py
  pre:scripts/firmware_version.py
  pre:scripts/pin_components.py
  post:scripts/merge_firmware.py
; USB is a CH343 to UART0, which is where the console goes by default.
build_flags =
  ${env.build_flags}
  -DBOARD_HEADER='"board/lcd4b_p4.h"'
  ; Voice: the wake word, Assist and spoken replies (services/voice.h).
  -DVOICE_ASSIST
  ; WiFiManager's country table reads the PHY's maximum transmit power from
  ; the sdkconfig, and a P4 has no PHY to configure: the radio is the C6's.
  ; 20 dBm, the S3 builds' value and the C6's own.
  -DCONFIG_ESP32_PHY_MAX_WIFI_TX_POWER=20

; ESP-IDF built from source for this board, as for the 4848S040, because the
; prebuilt P4 libraries could not keep the Wi-Fi link up.
;
; The link to the C6 is SDIO, and with the prebuilt libraries it wedged
; within seconds of the first cover art download: from then on every request
; and every RPC to the C6 timed out, and the UI stalled behind them. With
; warnings on, the cause showed: "RX buffer alloc failed (len=20480);
; dropping read". ESP-Hosted's streaming receive grows its buffer from
; internal DMA memory as bursts arrive, a burst outgrew what was free, the
; read was dropped, and before 2.13 a dropped read was never recovered. Not
; the SDIO clock (20 MHz failed the same) and not the C6's firmware version.
;
; So, three things:
;  - ESP-Hosted 2.13.1 on the P4, which allocates its receive buffers once,
;    at start-up, sized from the C6's queue, instead of mid-burst. 2.13.0
;    only dropped the read where it had asserted, and the link stayed down
;    after it all the same. The C6 runs 2.12.13 (Espressif's
;    espressif.github.io/arduino-esp32/hosted/esp32c6-v2.12.13.bin; there is
;    no 2.13 image), which 2.13.1 talks to without complaint.
;  - TLS buffers and lwIP's packet buffers in PSRAM, leaving the internal
;    DMA memory to the SDIO driver: a TCP window of 64 KB a connection, in
;    internal RAM, was what crowded it out. These made a dropped read rarer
;    -- uploads got from 184 KB to 765 KB to a whole 2.7 MB update -- but on
;    2.13.0 the link still wedged now and then, a 2.7 MB update among the
;    casualties. With 2.13.1 as well, eight 3 MB updates in a row and a
;    five-minute soak went through without a dropped read.
;  - Warnings in the log, so a dropped read says so.
;
; Everything else the manifest names is held where the prebuilt libraries
; had it (their versions.txt), by scripts/pin_components.py: a source build
; otherwise resolves every range afresh, and the first one here moved a
; dozen components -- esp_wifi_remote, mdns, littlefs among them -- after
; which esp_wifi_init failed with ESP_ERR_INVALID_ARG.
custom_component_pins =
  espressif/esp_hosted@2.13.1
  espressif/esp_wifi_remote@1.6.3
  espressif/mdns@1.11.3
  espressif/esp_modem@2.0.2
  espressif/lan867x@2.0.0
  espressif/esp-dsp@1.8.0
  espressif/esp-sr@2.4.6
  espressif/esp-modbus@2.1.3
  joltwallet/littlefs@1.22.2
;
; And the DSI controller's interrupts kept in IRAM, so a flash write -- a
; setting saved, a pick written to the history -- cannot hold off the
; re-arm of the next frame's DMA. HomeTiles found the panel flashing blue at
; every flash write without these (its tools/esp-idf-3.3.7-p4-cache-safe).
;
; Give this env a PlatformIO home of its own (PLATFORMIO_CORE_DIR): the build
; rewrites the Arduino framework's component manifest and libraries there.
custom_sdkconfig =
  CONFIG_LCD_DSI_ISR_CACHE_SAFE=y
  CONFIG_DW_GDMA_ISR_IRAM_SAFE=y
  CONFIG_DW_GDMA_OBJ_DRAM_SAFE=y
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_LOG_DEFAULT_LEVEL_WARN=y

; The Qualia's faces, for the same glass. Keep in step with font_table.cpp.
; And the wake words' models, as for amoled466-s3: this board has microphones.
; The faces compressed, and inflated into PSRAM at run time
; (scripts/deflate_embeds.py): 1.10 MB of them is 0.23 MB so, which a
; 4 MB app slot holding all of this needs.
board_build.embed_files =
  data/deflated/ui_font_34.vlw.z
  data/deflated/ui_font_38.vlw.z
  data/deflated/ui_font_45.vlw.z
  data/deflated/ui_font_54.vlw.z
  data/deflated/ui_font_23.vlw.z
  data/deflated/ui_font_26.vlw.z
  data/deflated/ui_font_30.vlw.z
  data/hey_jarvis.tflite
  data/okay_nabu.tflite
  data/hey_mycroft.tflite
  data/alexa.tflite

; The RGB boards' framebuffer stage, opened by hardware/lcd4b/panel.cpp
; rather than rgb_panel.cpp.
build_src_filter =
  +<*>
  -<ui/headless/>
  -<ui/round/>
  -<hardware/rgb/rgb_panel.cpp>
  -<hardware/qualia/>
  -<hardware/waveshare/>
  -<hardware/round360/>
  -<hardware/lcd28c/>
  -<hardware/headless/>
  -<hardware/matouch21/>
  -<hardware/guition4848/>
  -<hardware/amoled466/>
